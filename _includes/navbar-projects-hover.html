<style>
/* Distill nav uses .nav-dropdown + .nav-dropdown-content */
@media (hover: hover) and (pointer: fine) {
  .distill-site-nav .nav-dropdown:hover .nav-dropdown-content,
  .distill-site-nav .nav-dropdown:focus-within .nav-dropdown-content {
    display: block;
  }
}
</style>

<script>
// Desktop behavior for Distill:
// - Hover opens dropdown
// - Clicking "Projects" navigates to projects.html
// Mobile/touch keeps default tap-to-open behavior.
document.addEventListener("DOMContentLoaded", function () {
  var desktopPointer = window.matchMedia("(hover: hover) and (pointer: fine)");
  var dropdowns = document.querySelectorAll(".distill-site-nav .nav-dropdown");

  dropdowns.forEach(function (dropdown) {
    var button = dropdown.querySelector(".nav-dropbtn");
    var menu = dropdown.querySelector(".nav-dropdown-content");
    if (!button || !menu) return;

    var label = button.textContent.replace("▾", "").trim().toLowerCase();
    if (label !== "projects") return;

    button.addEventListener(
      "click",
      function (e) {
        if (!desktopPointer.matches) return;
        if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
        e.preventDefault();
        e.stopPropagation();
        e.stopImmediatePropagation();
        window.location.assign("projects.html");
      },
      true
    );
  });
});
</script>
